[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptx2markdown"
version = "0.2.0.dev0"
description = "Deterministic, asset-safe PPTX to Markdown conversion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.10,<3",
    "omml2latex>=0.1.0",
    "chart2md>=0.1.0",
    "olefile>=0.47",
    "smartart2md>=0.1.1",
]

[project.optional-dependencies]
agent = ["anthropic>=2.12"]

[project.scripts]
pptx2markdown = "pptx2markdown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx2markdown"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

