name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip ruff build twine && pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Tests
        run: python -m unittest discover -v
      - name: Package check
        run: python -m build && python -m twine check dist/*
