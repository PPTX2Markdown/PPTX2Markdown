name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff build twine
      - name: Lint
        run: ruff check src tests scripts benchmarks
      - name: Format check
        run: ruff format --check src tests scripts benchmarks
      - name: Package metadata and contents
        run: python -m build && python -m twine check dist/*

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp]"
      - name: Tests (golden snapshots included)
        run: python -m unittest discover -v

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install "$(ls dist/*.whl)[mcp]"
      - name: Exercise installed CLI and MCP server
        run: |
          .wheel-smoke/bin/pptx2markdown --help
          .wheel-smoke/bin/pptx2markdown tests/fixtures/golden/synthetic_reading_order.pptx --output-dir .smoke-output
          test -f .smoke-output/synthetic_reading_order/synthetic_reading_order.md
          .wheel-smoke/bin/pptx2markdown tests/fixtures/golden/synthetic_text_objects.pptx --review > review.json
          .wheel-smoke/bin/pptx2markdown tests/fixtures/golden/synthetic_text_objects.pptx --audit
          .wheel-smoke/bin/python -c "import pptx2markdown.mcp_server"
