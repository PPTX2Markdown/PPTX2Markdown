name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip ruff build twine && python -m pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Package metadata and contents
        run: python -m build && python -m twine check dist/*

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -v
      - name: Golden snapshots are current
        run: python scripts/update_goldens.py --check

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Exercise installed CLI
        run: |
          .wheel-smoke/bin/pptx2markdown --help
          .wheel-smoke/bin/pptx2markdown tests/fixtures/golden/synthetic_reading_order.pptx --output-dir .smoke-output --work-dir .smoke-work
          test -f .smoke-output/synthetic_reading_order/synthetic_reading_order.md
