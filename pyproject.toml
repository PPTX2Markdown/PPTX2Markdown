[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptx2markdown"
version = "0.2.0"
description = "Deterministic PPTX to Markdown, JSON and RAG chunks that reports its own uncertain decisions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Moonyoung Lee", email = "happy518596@gmail.com" },
    { name = "Inseong Lee", email = "sossos5989@naver.com" },
    { name = "Seung-Woo Jeong", email = "zzs6348@gmail.com" },
]
maintainers = [
    { name = "Moonyoung Lee", email = "happy518596@gmail.com" },
    { name = "Inseong Lee", email = "sossos5989@naver.com" },
    { name = "Seung-Woo Jeong", email = "zzs6348@gmail.com" },
]
# omml2latex uses 3.12+ f-string syntax.
requires-python = ">=3.12"
keywords = ["pptx", "powerpoint", "markdown", "converter", "rag", "document-parsing", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pydantic>=2.10,<3",
    "omml2latex>=0.1.0",
    "chart2md>=0.1.0",
    "olefile>=0.47",
    "smartart2md>=0.1.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
# Trims the page margin LibreOffice leaves around EMF/WMF drawn as PNG.
images = ["pillow>=10"]

[project.scripts]
pptx2markdown = "pptx2markdown.cli:main"
pptx2markdown-mcp = "pptx2markdown.mcp_server:main"

[project.urls]
Homepage = "https://github.com/PPTX2Markdown/PPTX2Markdown"
Repository = "https://github.com/PPTX2Markdown/PPTX2Markdown"
Issues = "https://github.com/PPTX2Markdown/PPTX2Markdown/issues"
Changelog = "https://github.com/PPTX2Markdown/PPTX2Markdown/blob/main/CHANGELOG.md"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/pptx2markdown"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/src",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/README.ko.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
